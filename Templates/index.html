<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Work+Sans:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/style.css">
    <title>Hospital Registration</title>
</head>
<body>
    <div class="container">
        <h2>Patient Registration</h2>
        <form action="http://localhost/cgi-bin/hospital.cgi" method="get">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="number" name="age" placeholder="Age" required>
            <select name="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            <input type="hidden" name="step" value="1">
            <button type="submit">Next: Medical History</button>
        </form>
    </div>
</body>
</html>
